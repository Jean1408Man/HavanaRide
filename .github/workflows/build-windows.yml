mkdir -p .github/workflows

tee .github/workflows/build-windows.yml > /dev/null <<'EOF'
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Ver archivos del proyecto
        run: |
          dir
          if exist assets dir assets
          if exist sprites dir sprites

      - name: Crear ejecutable
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name "HavanaRide" --add-data "assets;assets" --add-data "sprites;sprites" main.py

      - name: Subir resultado
        uses: actions/upload-artifact@v5
        with:
          name: HavanaRide-Windows
          path: dist/HavanaRide
EOF